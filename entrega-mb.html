<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Entregas Mas Belleza</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#F5F4EF; --line:#DEDBCF; --ink:#2C2A22; --ink-soft:#7A7669;
    --moss:#5C7A3B; --moss-bg:#EAF3DE; --amber:#B0782F; --amber-bg:#FAEEDA;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:16px;}
  h1{font-size:16px; font-weight:600; margin:0 0 4px;}
  .sub{font-size:12px; color:var(--ink-soft); margin:0 0 16px;}
  select, input[type=text]{width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px;}
  .tienda-titulo{font-size:13px; font-weight:600; margin:0 0 8px;}
  label.fila{display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13px;}
  .fotos-guia{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .foto-btn{flex:1; min-width:100px; height:130px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px dashed var(--ink-soft); border-radius:8px; background:var(--paper); font-size:10px; color:var(--ink-soft); cursor:pointer; overflow:hidden; padding:0;}
  .foto-btn.lista{border-style:solid; border-color:var(--moss); color:var(--moss);}
  .foto-btn img{width:100%; height:100%; object-fit:cover;}
  .foto-guia-item{margin-bottom:10px; padding:8px; border:1px solid var(--line); border-radius:8px;}
  .foto-guia-nombre{font-size:12px; font-weight:600; margin-bottom:6px;}
  .foto-guia-thumbs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .foto-guia-thumbs img{width:56px; height:56px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .btn-add-foto{font-size:11px; padding:6px 10px; border:1px dashed var(--ink-soft); border-radius:6px; background:var(--paper); color:var(--ink-soft); cursor:pointer;}
  .foto-merc-btn{width:100%; height:80px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:1px dashed var(--ink-soft); border-radius:8px; background:var(--paper); font-size:12px; color:var(--ink-soft); cursor:pointer; overflow:hidden; padding:0;}
  .foto-merc-btn.lista{border-style:solid; border-color:var(--moss); color:var(--moss);}
  .foto-merc-btn img{width:100%; height:100%; object-fit:cover;}
  button.confirmar{width:100%; background:var(--ink); color:#fff; border:none; height:46px; border-radius:8px; font-size:14px; font-weight:600;}
  button.confirmar:disabled{opacity:0.4;}
  .stamp{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--amber-bg); color:var(--amber);}
  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0;}
</style>
</head>
<body>

<div id="app"></div>

<script>
const SUPABASE_URL = 'https://wvnzifxqssisbkgfjgrx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Gk94nITpyOHtHDa-Y8HYSA_RLLMUGii';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');
let choferActual = JSON.parse(localStorage.getItem('chofer_mb') || 'null');
const fotosGuiaSeleccionadas = {}; // { entregaId: File[] }

async function init(){
  if(!choferActual){
    await mostrarSelectorChofer();
  } else {
    await mostrarEntregas();
  }
}

async function mostrarSelectorChofer(){
  const { data: choferes, error } = await sb.from('choferes_mb').select('id, nombre').order('nombre');
  if(error){ app.innerHTML = `<p>Error al cargar: ${error.message}</p>`; return; }
  app.innerHTML = `
    <h1>Entregas Mas Belleza</h1>
    <p class="sub">¿Quién eres?</p>
    <select id="sel-chofer">
      <option value="">Selecciona tu nombre</option>
      ${choferes.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
    </select>
  `;
  document.getElementById('sel-chofer').addEventListener('change', (e)=>{
    const c = choferes.find(x=>x.id===e.target.value);
    if(!c) return;
    choferActual = c;
    localStorage.setItem('chofer_mb', JSON.stringify(c));
    mostrarEntregas();
  });
}

async function mostrarEntregas(){
  Object.keys(fotosGuiaSeleccionadas).forEach(k=>delete fotosGuiaSeleccionadas[k]);

  const { data: entregas, error } = await sb.from('entregas_mb')
    .select('id, guia_remitente, tienda_entrega, distrito_destino, estado')
    .eq('chofer_id', choferActual.id)
    .is('entregado_at', null)
    .order('tienda_entrega');
  if(error){ app.innerHTML = `<p>Error al cargar: ${error.message}</p>`; return; }

  const grupos = {};
  (entregas||[]).forEach(e=>{
    const clave = e.tienda_entrega || e.distrito_destino || 'Sin tienda asignada';
    if(!grupos[clave]) grupos[clave] = [];
    grupos[clave].push(e);
  });

  app.innerHTML = `
    <h1>Hola, ${choferActual.nombre}</h1>
    <p class="sub">Marca las guías que entregas juntas · <a href="#" id="cambiar-chofer">cambiar</a></p>
    ${Object.keys(grupos).length===0 ? '<div class="empty">No tienes entregas pendientes.</div>' : Object.entries(grupos).map(([tienda, lista])=>`
      <div class="card grupo-tienda" data-tienda="${tienda}">
        <div class="tienda-titulo">${tienda}</div>
        ${lista.map(e=>`
          <label class="fila">
            <input type="checkbox" class="chk-entrega" value="${e.id}" checked>
            <span>${e.guia_remitente || 'sin N°'}</span>
          </label>
        `).join('')}
        <div class="fotos-guia-lista">
          ${lista.map(e=>`
            <div class="foto-guia-item">
              <div class="foto-guia-nombre">${e.guia_remitente || 'sin N°'}</div>
              <div class="foto-guia-thumbs" id="thumbs-${e.id}"></div>
              <button type="button" class="btn-add-foto" data-entrega-id="${e.id}">+ Foto de esta guía</button>
            </div>
          `).join('')}
        </div>
        <input type="file" accept="image/*" capture="environment" class="input-foto-guia" style="display:none;">
        <div style="font-size:12px; font-weight:600; margin:10px 0 6px;">Foto de la mercadería entregada</div>
        <button type="button" class="foto-merc-btn">Una sola foto para el grupo</button>
        <input type="file" accept="image/*" capture="environment" class="input-foto-merc" style="display:none;">
        <div style="font-size:12px; font-weight:600; margin:14px 0 6px;">¿Quién recibió?</div>
        <input type="text" class="input-receptor" placeholder="Nombre de quien recibe" style="margin-bottom:14px;">
        <button type="button" class="confirmar" data-tienda="${tienda}">Confirmar entrega</button>
      </div>
    `).join('')}
  `;

  document.getElementById('cambiar-chofer')?.addEventListener('click', (e)=>{
    e.preventDefault();
    localStorage.removeItem('chofer_mb');
    choferActual = null;
    mostrarSelectorChofer();
  });

  document.querySelectorAll('.grupo-tienda').forEach(grupo=>{
    const inputFotoGuia = grupo.querySelector('.input-foto-guia');
    let entregaIdActivo = null;
    const pintarThumbs = (entregaId) => {
      const cont = grupo.querySelector(`#thumbs-${entregaId}`);
      const archivos = fotosGuiaSeleccionadas[entregaId] || [];
      cont.innerHTML = archivos.map(f=>`<img src="${URL.createObjectURL(f)}" alt="Foto de la guía">`).join('');
    };
    grupo.querySelectorAll('.btn-add-foto').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        entregaIdActivo = btn.dataset.entregaId;
        inputFotoGuia.click();
      });
    });
    inputFotoGuia.addEventListener('change', ()=>{
      if(inputFotoGuia.files[0] && entregaIdActivo){
        if(!fotosGuiaSeleccionadas[entregaIdActivo]) fotosGuiaSeleccionadas[entregaIdActivo] = [];
        fotosGuiaSeleccionadas[entregaIdActivo].push(inputFotoGuia.files[0]);
        pintarThumbs(entregaIdActivo);
        inputFotoGuia.value = '';
      }
    });

    const inputFotoMerc = grupo.querySelector('.input-foto-merc');
    const btnFotoMerc = grupo.querySelector('.foto-merc-btn');
    btnFotoMerc.addEventListener('click', ()=> inputFotoMerc.click());
    inputFotoMerc.addEventListener('change', ()=>{
      if(inputFotoMerc.files[0]){
        grupo._fotoMercaderia = inputFotoMerc.files[0];
        btnFotoMerc.classList.add('lista');
        btnFotoMerc.innerHTML = `<img src="${URL.createObjectURL(inputFotoMerc.files[0])}" alt="Foto de la mercadería">`;
      }
    });

    grupo.querySelector('.confirmar').addEventListener('click', async ()=>{
      const btn = grupo.querySelector('.confirmar');
      const seleccionadas = [...grupo.querySelectorAll('.chk-entrega:checked')].map(c=>c.value);
      const receptor = grupo.querySelector('.input-receptor').value.trim();
      if(seleccionadas.length===0){ alert('Marca al menos una guía.'); return; }
      if(!receptor){ alert('Escribe quién recibió.'); return; }
      if(!grupo._fotoMercaderia){ alert('Falta la foto de la mercadería.'); return; }

      btn.disabled = true;
      btn.textContent = 'Subiendo...';

      try{
        const fotoMercUrl = await subirFoto(grupo._fotoMercaderia);
        for(const id of seleccionadas){
          const archivos = fotosGuiaSeleccionadas[id] || [];
          const urls = [];
          for(const archivo of archivos){
            urls.push(await subirFoto(archivo));
          }
          const { error } = await sb.from('entregas_mb').update({
            estado: 'culminado',
            entregado_at: new Date().toISOString(),
            receptor_nombre: receptor,
            foto_evidencia_url: fotoMercUrl,
            foto_guia_urls: urls.length ? urls : null,
          }).eq('id', id);
          if(error) throw error;
        }
        await mostrarEntregas();
      }catch(err){
        alert('Error al confirmar: '+err.message);
        btn.disabled = false;
        btn.textContent = 'Confirmar entrega';
      }
    });
  });
}

async function subirFoto(file){
  const nombre = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
  const { error } = await sb.storage.from('evidencias-mb').upload(nombre, file);
  if(error) throw error;
  const { data } = sb.storage.from('evidencias-mb').getPublicUrl(nombre);
  return data.publicUrl;
}

init();
</script>
</body>
</html>
