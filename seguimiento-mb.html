<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Seguimiento de entregas - Mas Belleza</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#F5F4EF; --line:#DEDBCF; --ink:#2C2A22; --ink-soft:#7A7669;
    --moss:#5C7A3B; --moss-bg:#EAF3DE; --amber:#B0782F; --amber-bg:#FAEEDA;
    --blue:#0C447C; --blue-bg:#E6F1FB;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding:16px; max-width:640px; margin:0 auto;}
  h1{font-size:17px; font-weight:600; margin:0 0 4px;}
  .sub{font-size:12px; color:var(--ink-soft); margin:0 0 18px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px;}
  .lote-titulo{font-size:14px; font-weight:600; margin:0;}
  .barra{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 4px;}
  .barra-fill{height:100%; background:var(--moss);}
  .progreso{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .fila-entrega{padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
  .stamp{font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px;}
  .stamp.registrado{background:var(--paper); color:var(--ink-soft);}
  .stamp.en_servicio{background:var(--amber-bg); color:var(--amber);}
  .stamp.culminado{background:var(--moss-bg); color:var(--moss);}
  .thumbs{display:flex; gap:6px; margin-top:6px;}
  .thumbs img{width:50px; height:50px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
  .empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:40px 0;}
</style>
</head>
<body>

<h1>Seguimiento de entregas</h1>
<p class="sub">Mas Belleza · Peruvian Logistics International</p>
<div id="app"></div>

<div id="foto-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:999; padding:16px;">
  <div style="background:#fff; border-radius:12px; padding:14px; max-width:min(92vw,480px); text-align:center;">
    <img id="foto-grande-img" src="" alt="Foto" style="max-width:100%; max-height:65vh; border-radius:8px; margin-bottom:14px;">
    <div style="display:flex; gap:8px;">
      <button id="foto-cerrar" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff;">Cerrar</button>
      <a id="foto-descargar" download style="flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; text-decoration:none; color:var(--ink); text-align:center;">Descargar</a>
      <button id="foto-compartir" style="flex:1; padding:10px; border:none; border-radius:8px; background:var(--ink); color:#fff;">Compartir</button>
    </div>
  </div>
</div>


<script>
const SUPABASE_URL = 'https://wvnzifxqssisbkgfjgrx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Gk94nITpyOHtHDa-Y8HYSA_RLLMUGii';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');

function fmtFecha(fechaISO){
  if(!fechaISO) return '';
  const [aaaa, mm, dd] = fechaISO.split('-');
  return `${dd}/${mm}/${aaaa}`;
}

async function cargar(){
  const { data, error } = await sb.from('lotes')
    .select(`id, codigo, fecha_programada, estado,
      entregas_mb ( id, guia_remitente, nuestra_guia, estado, distrito_partida, tienda_entrega, chofer_nombre, placa, factura_numero, entregado_at, receptor_nombre, foto_guia_urls, foto_evidencia_url )`)
    .order('fecha_programada', { ascending: false });
  if(error){ app.innerHTML = `<p>Error al cargar: ${error.message}</p>`; return; }

  if(!data || data.length===0){ app.innerHTML = '<div class="empty">Todavía no hay entregas registradas.</div>'; return; }

  app.innerHTML = data.map(lote=>{
    const entregas = lote.entregas_mb || [];
    const entregadas = entregas.filter(e=>e.estado==='culminado').length;
    const total = entregas.length;
    const pct = total ? Math.round(entregadas/total*100) : 0;
    return `
      <div class="card">
        <p class="lote-titulo">${lote.codigo} · ${fmtFecha(lote.fecha_programada)}</p>
        <div class="barra"><div class="barra-fill" style="width:${pct}%;"></div></div>
        <p class="progreso">${entregadas} de ${total} entregadas</p>
        ${entregas.map(e=>`
          <div class="fila-entrega">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span>${e.guia_remitente || 'sin N°'}${e.nuestra_guia ? (' · nuestra '+e.nuestra_guia) : ''}</span>
              <span class="stamp ${e.estado}">${e.estado}</span>
            </div>
            <div style="font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.6;">
              ${e.distrito_partida ? `Sale de: ${e.distrito_partida}<br>` : ''}
              ${e.tienda_entrega ? `Va a: ${e.tienda_entrega}<br>` : ''}
              ${e.chofer_nombre ? `Chofer: ${e.chofer_nombre}${e.placa ? ' · '+e.placa : ''}<br>` : ''}
              ${e.factura_numero ? `Factura: ${e.factura_numero}<br>` : ''}
            </div>
            ${e.estado==='culminado' ? `
              <div style="font-size:11px; color:var(--ink-soft); margin-top:4px;">
                Recibió: ${e.receptor_nombre || '—'}
              </div>
              <div class="thumbs">
                ${(e.foto_guia_urls||[]).map(u=>`<img src="${u}" onclick="verFotoGrande('${u}')" style="cursor:pointer;">`).join('')}
                ${e.foto_evidencia_url ? `<img src="${e.foto_evidencia_url}" onclick="verFotoGrande('${e.foto_evidencia_url}')" style="cursor:pointer;">` : ''}
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>
    `;
  }).join('');
}

function verFotoGrande(url){
  document.getElementById('foto-grande-img').src = url;
  document.getElementById('foto-descargar').href = url;
  document.getElementById('foto-overlay').style.display = 'flex';
}
document.getElementById('foto-cerrar').addEventListener('click', ()=>{
  document.getElementById('foto-overlay').style.display = 'none';
});
document.getElementById('foto-compartir').addEventListener('click', async ()=>{
  const url = document.getElementById('foto-grande-img').src;
  try{
    const resp = await fetch(url);
    const blob = await resp.blob();
    const file = new File([blob], 'evidencia.jpg', { type: blob.type || 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: 'Evidencia de entrega' });
      return;
    }
  }catch(e){
    if(e.name === 'AbortError') return; // el usuario cerró el cuadro de compartir, no hacer nada
  }
  window.open(url, '_blank');
});

cargar();
</script>
</body>
</html>
